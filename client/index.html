<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="School Uniform Exchange Platform: buy, sell, and swap second-hand school uniforms with other students." />
    <title>School Uniform Exchange Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Styles for the boot screen shown before React mounts (kept in sync with components/Loader.jsx) -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f5fafd; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      .boot-logo { width: 64px; height: 64px; border-radius: 16px; background: #1f4e79; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgb(31 78 121 / 0.25); animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-name { font-weight: 800; letter-spacing: -0.01em; color: #1f4e79; font-size: 14px; text-align: center; padding: 0 24px; }
      .boot-bar { width: 112px; height: 4px; border-radius: 99px; background: #e3f1fb; overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 99px; background: #1f4e79; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.94); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 3 3.75 5.25 2.25 10.5 6 11.25V21h12v-9.75l3.75-.75-1.5-5.25L15 3c0 1.657-1.343 3-3 3S9 4.657 9 3Z" />
          </svg>
        </div>
        <div class="boot-name">School Uniform Exchange Platform</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

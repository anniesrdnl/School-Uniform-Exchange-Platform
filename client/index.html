<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="School Uniform Exchange Platform: buy, sell, and swap second-hand school uniforms with other students." />
    <title>School Uniform Exchange Platform</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Styles for the boot screen shown before React mounts (kept in sync with components/Loader.jsx) -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #fff7e6; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      .boot-logo { width: 80px; height: 80px; object-fit: contain; scale: 1.25; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-name { font-weight: 800; letter-spacing: -0.01em; color: #102e4a; font-size: 14px; text-align: center; padding: 0 24px; }
      .boot-bar { width: 112px; height: 4px; border-radius: 99px; background: #eee9db; overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 99px; background: #102e4a; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.94); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <img class="boot-logo" src="/src/assets/logo.png" alt="" width="256" height="256" />
        <div class="boot-name">School Uniform Exchange Platform</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

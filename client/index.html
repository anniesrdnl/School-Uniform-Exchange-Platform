<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2d55" />
    <title>Uniform Exchange P</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Styles for the boot screen shown before React mounts (kept in sync with components/Loader.jsx) -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f5f7fa; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      .boot-logo { width: 64px; height: 64px; border-radius: 18px; background: #0f2d55; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; box-shadow: 0 10px 30px rgb(15 45 85 / 0.25); animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-name { font-weight: 800; letter-spacing: 0.08em; color: #0f2d55; font-size: 14px; }
      .boot-bar { width: 120px; height: 4px; border-radius: 99px; background: #e8f0fb; overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 99px; background: #2f8f5b; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.94); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-logo">S</div>
        <div class="boot-name">SUEPS</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

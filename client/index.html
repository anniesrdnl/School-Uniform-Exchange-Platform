<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="School Uniform Exchange Platform: buy, sell, and swap second-hand school uniforms with other students." />
    <title>School Uniform Exchange Platform</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Boot screen shown before React mounts: a skeleton of the header and a page of cards, with a soft shimmer.
         Kept in sync with AppSkeleton in components/Loader.jsx so the hand-off is seamless. -->
    <style>
      .boot { position: fixed; inset: 0; overflow: hidden; background: #ffffff; padding: 8px 12px 0; }
      .boot-bone { border-radius: 6px; background: linear-gradient(90deg, #eef1f4 25%, #f7f8f9 50%, #eef1f4 75%); background-size: 200% 100%; animation: boot-shimmer 1.4s ease-in-out infinite; }
      .boot-header { max-width: 80rem; height: 56px; margin: 0 auto; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 16px; background: #ffffff; box-shadow: 0 10px 15px -3px rgb(14 54 97 / 0.05), 0 0 0 1px rgb(14 54 97 / 0.05); }
      .boot-row { display: flex; align-items: center; gap: 12px; }
      .boot-links, .boot-wide { display: none; }
      .boot-main { max-width: 80rem; margin: 0 auto; padding: 12px 4px 0; }
      .boot-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
      .boot-card { overflow: hidden; border-radius: 16px; border: 1px solid rgb(221 227 233 / 0.7); }
      .boot-card > .boot-bone:first-child { aspect-ratio: 1; border-radius: 0; }
      .boot-card-body { padding: 12px; display: grid; gap: 8px; }
      @media (min-width: 640px) { .boot { padding: 12px 16px 0; } .boot-header { height: 64px; padding: 0 20px; } .boot-main { padding: 24px 0 0; } .boot-brand-text { display: grid !important; } .boot-grid { gap: 16px; } }
      @media (min-width: 768px) { .boot-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .boot-links, .boot-wide { display: flex; } }
      @media (min-width: 1024px) { .boot { padding: 12px 32px 0; } .boot-header { padding: 0 24px; } .boot-main { padding: 24px 0 0; } }
      @keyframes boot-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-bone { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-header" aria-hidden="true">
          <div class="boot-row">
            <div class="boot-bone" style="width:40px;height:40px;border-radius:12px"></div>
            <div class="boot-brand-text" style="display:none;gap:6px"><div class="boot-bone" style="width:192px;height:14px"></div><div class="boot-bone" style="width:128px;height:10px"></div></div>
          </div>
          <div class="boot-row boot-links" style="gap:32px"><div class="boot-bone" style="width:64px;height:14px"></div><div class="boot-bone" style="width:64px;height:14px"></div><div class="boot-bone" style="width:64px;height:14px"></div></div>
          <div class="boot-row" style="gap:8px"><div class="boot-bone" style="width:40px;height:40px;border-radius:999px"></div><div class="boot-bone boot-wide" style="width:96px;height:44px;border-radius:999px"></div></div>
        </div>
        <div class="boot-main" aria-hidden="true">
          <div class="boot-bone" style="height:32px;width:224px;max-width:100%"></div>
          <div class="boot-bone" style="height:16px;width:320px;max-width:100%;margin-top:8px"></div>
          <div class="boot-grid">
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          <div class="boot-card"><div class="boot-bone"></div><div class="boot-card-body"><div class="boot-bone" style="height:16px;width:75%"></div><div class="boot-bone" style="height:12px;width:50%"></div><div class="boot-bone" style="height:20px;width:33%"></div></div></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="School Uniform Exchange Platform: buy, sell, and swap second-hand school uniforms with other students." />
    <title>School Uniform Exchange Platform</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Boot screen shown before React starts: the header, a placeholder shaped like the page being opened (picked
         from the URL by the script in <body>), and the phone tab bar. Mirrors components/PageSkeletons.jsx, which
         takes over once React is running, so the hand-off is seamless. -->
    <style>
      .boot { position: fixed; inset: 0; overflow: hidden; background: #ffffff; font-family: "Poppins", system-ui, sans-serif; }
      .boot .b, .boot .dk { border-radius: 6px; background: linear-gradient(90deg, #eef1f4 25%, #f7f8f9 50%, #eef1f4 75%); background-size: 200% 100%; animation: boot-shimmer 1.4s ease-in-out infinite; flex-shrink: 0; max-width: 100%; }
      .boot .dk { background-image: linear-gradient(90deg, rgb(255 255 255 / 0.1) 25%, rgb(255 255 255 / 0.2) 50%, rgb(255 255 255 / 0.1) 75%); }
      .boot-head { padding: 8px 12px 0; }
      .boot-bar { max-width: 80rem; margin: 0 auto; border-radius: 16px; background: #fff; box-shadow: 0 10px 15px -3px rgb(14 54 97 / 0.05), 0 0 0 1px rgb(14 54 97 / 0.05); }
      .boot-strip { display: none; height: 36px; padding: 0 24px; align-items: center; justify-content: space-between; border-radius: 16px 16px 0 0; background: linear-gradient(90deg, rgb(226 231 236 / 0.8), #fff, #eef1f4); }
      .boot-nav { height: 56px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .boot-main { max-width: 80rem; margin: 0 auto; padding: 12px 16px 0; }
      .boot .row { display: flex; align-items: center; gap: 12px; }
      .boot .col { display: flex; flex-direction: column; gap: 8px; }
      .boot .card { border-radius: 16px; border: 1px solid rgb(221 227 233 / 0.7); background: #fff; overflow: hidden; }
      .boot .pad { padding: 16px; }
      .boot .sq { aspect-ratio: 1; border-radius: 0; width: 100%; }
      .boot .ar { aspect-ratio: 1; width: 100%; border-radius: 24px; }
      .boot .bcb { padding: 12px; display: grid; gap: 8px; }
      .boot .g2-4, .boot .g-browse, .boot .g-cat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .boot .split-detail, .boot .split-browse, .boot .split-hero, .boot .split-2, .boot .split-chat { display: grid; gap: 20px; }
      .boot .hero { background: #0e3661; border-radius: 24px; padding: 24px 16px; }
      .boot .tabs { display: flex; gap: 24px; height: 40px; align-items: center; box-shadow: inset 0 -1px 0 #dde3e9; overflow: hidden; }
      .boot .chat { height: calc(100dvh - 11.4rem); margin: 0 -16px; border-radius: 0; border-left: 0; border-right: 0; }
      .boot .show-sm, .boot .show-md, .boot .show-lg { display: none !important; }
      .boot-tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: 3.85rem; display: grid; padding: 0 8px; border-radius: 28px 28px 0 0; background: #fff; box-shadow: 0 -6px 16px rgb(14 54 97 / 0.1); }
      .boot-tabbar > div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
      @media (min-width: 640px) {
        .boot-head { padding: 12px 16px 0; } .boot-nav { height: 64px; padding: 0 20px; } .boot-main { padding-top: 24px; }
        .boot .g2-4, .boot .g-browse, .boot .g-cat { gap: 16px; } .boot .g-browse { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .boot .hero { padding: 48px 40px; } .boot .tabs { height: 44px; } .boot .ar { aspect-ratio: 4 / 3; } .boot .show-sm { display: flex !important; }
        .boot .chat { margin: 0; border-radius: 24px; border: 1px solid rgb(221 227 233 / 0.7); }
      }
      @media (min-width: 768px) {
        .boot-strip, .boot .show-md { display: flex !important; } .boot .hide-md, .boot-tabbar { display: none !important; }
        .boot .g2-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .boot .split-chat { grid-template-columns: 320px 1fr; gap: 0; } .boot .chat { height: min(calc(100dvh - 12.5rem), 52rem); min-height: 30rem; }
      }
      @media (min-width: 1024px) {
        .boot-head { padding: 12px 32px 0; } .boot-nav { padding: 0 24px; } .boot-main { padding: 24px 32px 0; }
        .boot .g-cat { grid-template-columns: repeat(4, minmax(0, 1fr)); } .boot .show-lg { display: block !important; } .boot .hide-lg { display: none !important; }
        .boot .split-detail { grid-template-columns: 7fr 5fr; gap: 40px; } .boot .split-browse { grid-template-columns: 17rem 1fr; gap: 32px; align-items: start; }
        .boot .split-hero { grid-template-columns: minmax(0, 1fr) 22rem; gap: 40px; align-items: center; } .boot .split-2 { grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
        .boot .hero { padding: 56px; } .boot .split-chat { grid-template-columns: 360px 1fr; }
      }
      @media (min-width: 1024px) { .boot .g-browse { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      @media (min-width: 1536px) { .boot-bar, .boot-main { max-width: 88rem; } .boot .g-browse { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
      @keyframes boot-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot .b, .boot .dk { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-head" aria-hidden="true">
          <div class="boot-bar">
            <div class="boot-strip"><div class="row" style="gap:24px"><div class="b" style="width:144px;height:12px"></div><div class="b" style="width:176px;height:12px"></div></div><div class="b" style="width:160px;height:12px"></div></div>
            <div class="boot-nav">
              <div class="row"><div class="b" style="width:40px;height:40px;border-radius:12px"></div><div class="col show-sm" style="gap:6px"><div class="b" style="width:192px;height:14px"></div><div class="b" style="width:128px;height:10px"></div></div></div>
              <div class="row show-md" id="boot-links" style="gap:32px"></div>
              <div class="row" style="gap:8px"><div class="b" id="boot-account" style="width:40px;height:40px;border-radius:99px"></div><div class="b show-md" style="width:96px;height:44px;border-radius:99px"></div></div>
            </div>
          </div>
        </div>
        <div class="boot-main" id="boot-main" aria-hidden="true"></div>
        <div class="boot-tabbar" id="boot-tabbar" aria-hidden="true"></div>
      </div>
      <script>
        // Fill the boot screen with the placeholder for the page being opened (same shapes as PageSkeletons.jsx)
        (function () {
          var path = location.pathname, signedIn = false, chatOpen = /[?&]c=/.test(location.search);
          try { signedIn = !!localStorage.getItem('token'); } catch (e) {}
          function b(w, h, more, dark) { return '<div class="' + (dark ? 'dk' : 'b') + '" style="width:' + w + ';height:' + h + ';' + (more || '') + '"></div>'; }
          function dk(w, h, more) { return b(w, h, more, true); }
          function times(n, html) { return new Array(n + 1).join(html); }
          var card = '<div class="card"><div class="b sq"></div><div class="bcb">' + b('75%', '16px') + b('50%', '12px') + b('33%', '20px') + '</div></div>';
          var title = function (t, st) { return b(t, '32px') + b(st, '16px', 'margin-top:8px'); };
          var field = function (lw, h) { return '<div>' + b(lw, '16px', 'margin-bottom:6px') + b('100%', h || '44px', 'border-radius:12px') + '</div>'; };
          var tabs = function (ws) { return '<div class="tabs">' + ws.map(function (w) { return b(w, '14px'); }).join('') + '</div>'; };
          var rows = function (n) { return times(n, '<div class="row pad" style="border-top:1px solid rgb(221 227 233 / 0.6)">' + b('48px', '48px', 'border-radius:12px') + '<div class="col" style="flex:1">' + b('50%', '14px') + b('33%', '12px') + '</div>' + b('80px', '32px', 'border-radius:8px', false).replace('class="b"', 'class="b show-sm"') + '</div>'); };

          var pages = {
            home: '<div class="hero"><div class="split-hero"><div>' + dk('144px', '16px') + dk('90%', '40px', 'margin-top:12px;max-width:28rem') + dk('66%', '40px', 'margin-top:10px;max-width:24rem')
              + dk('100%', '16px', 'margin-top:16px;max-width:32rem') + dk('100%', '52px', 'margin-top:20px;max-width:36rem;border-radius:16px')
              + '<div class="row" style="margin-top:12px;gap:8px">' + dk('56px', '28px', 'border-radius:99px') + dk('80px', '28px', 'border-radius:99px') + dk('96px', '28px', 'border-radius:99px') + '</div>'
              + dk('256px', '20px', 'margin-top:28px') + '</div><div class="show-lg">'
              + times(3, '<div class="row" style="padding:14px;margin-bottom:10px;border-radius:16px;background:rgb(255 255 255 / 0.07)">' + dk('44px', '44px', 'border-radius:12px') + '<div class="col" style="flex:1;gap:6px">' + dk('112px', '14px') + dk('160px', '12px') + '</div></div>') + '</div></div></div>'
              + b('176px', '24px', 'margin:40px 0 16px') + '<div class="g-cat">' + times(4, '<div class="card row pad">' + b('44px', '44px', 'border-radius:12px') + '<div class="col" style="flex:1">' + b('80%', '14px') + b('56px', '12px') + '</div></div>') + '</div>'
              + '<div class="row" style="justify-content:space-between;margin-top:40px">' + b('144px', '24px') + b('56px', '16px') + '</div>' + tabs(['24px', '96px', '96px', '80px']) + '<div class="g2-4" style="margin-top:16px">' + times(4, card) + '</div>',
            splash: '<div class="split-2" style="padding-top:8px"><div class="col" style="align-items:center;gap:12px">' + b('256px', '32px', 'border-radius:99px') + b('60%', '44px', 'margin-top:12px') + b('80%', '44px') + b('75%', '44px')
              + b('100%', '16px', 'margin-top:8px;max-width:28rem') + b('75%', '16px', 'max-width:24rem') + '<div class="row" style="margin-top:20px">' + b('144px', '46px', 'border-radius:12px') + b('128px', '46px', 'border-radius:12px') + '</div></div>'
              + '<div>' + b('100%', 'auto', 'aspect-ratio:4/3;border-radius:24px') + '</div></div>',
            browse: title('240px', '384px') + '<div class="row card" style="height:52px;max-width:42rem;margin-top:16px;padding:0 6px 0 16px;border-radius:16px">' + b('20px', '20px', 'border-radius:99px') + b('192px', '16px') + b('88px', '42px', 'margin-left:auto;border-radius:12px') + '</div>'
              + '<div style="margin:14px 0 20px">' + tabs(['40px', '112px', '112px', '96px', '112px']) + '</div>'
              + '<div class="row" style="gap:8px;padding:4px 0">' + b('80px', '40px', 'border-radius:99px') + b('112px', '40px', 'border-radius:99px') + b('80px', '40px', 'border-radius:99px') + b('40px', '40px', 'margin-left:auto;border-radius:99px') + '</div>'
              + b('112px', '16px', 'margin-top:20px') + '<div class="g-browse" style="margin-top:16px">' + times(8, card) + '</div>',
            detail: '<div class="row" style="gap:8px">' + b('56px', '16px') + b('96px', '16px') + b('128px', '16px') + '</div><div class="split-detail" style="margin-top:20px"><div>' + b('100%', 'auto', '', false).replace('class="b"', 'class="b ar"')
              + '<div class="row" style="gap:8px;margin-top:18px">' + times(3, b('72px', '72px', 'border-radius:12px')) + '</div></div>'
              + '<div class="card" style="padding:20px;align-self:start"><div class="row" style="justify-content:space-between"><div class="row" style="gap:8px">' + b('80px', '24px', 'border-radius:99px') + b('96px', '24px', 'border-radius:99px') + '</div>' + b('96px', '12px') + '</div>'
              + b('75%', '32px', 'margin-top:16px') + b('33%', '36px', 'margin-top:8px') + '<div class="g2-4" style="grid-template-columns:1fr 1fr;gap:8px;margin-top:20px">' + times(4, b('100%', '60px', 'border-radius:12px')) + '</div>'
              + '<div class="row" style="margin-top:20px;padding:16px 0;border-top:1px solid #dde3e9;border-bottom:1px solid #dde3e9">' + b('44px', '44px', 'border-radius:99px') + '<div class="col" style="flex:1">' + b('48px', '12px') + b('128px', '16px') + '</div></div>'
              + '<div class="col" style="gap:16px;margin-top:20px">' + field('80px', '48px') + field('144px', '68px') + b('100%', '48px', 'border-radius:12px') + '</div></div></div>',
            messages: '<div class="card chat split-chat"><div class="' + (chatOpen ? 'show-md' : '') + '" style="display:flex;flex-direction:column;border-right:1px solid #dde3e9">'
              + '<div class="pad" style="border-bottom:1px solid #dde3e9"><div class="row" style="justify-content:space-between">' + b('128px', '28px') + b('32px', '20px', 'border-radius:99px') + '</div>' + b('100%', '44px', 'margin-top:12px;border-radius:99px') + b('100%', '40px', 'margin-top:12px;border-radius:12px') + '</div>'
              + '<div style="padding:8px">' + times(5, '<div class="row" style="padding:12px">' + b('44px', '44px', 'border-radius:99px') + '<div class="col" style="flex:1;gap:6px">' + b('50%', '14px') + b('66%', '12px') + b('90%', '12px') + '</div></div>') + '</div></div>'
              + (chatOpen
                ? '<div style="display:flex;flex-direction:column;background:linear-gradient(180deg,#f6f8fa,#fff 70%)"><div class="row pad" style="border-bottom:1px solid #dde3e9;background:#fff">' + b('40px', '40px', 'border-radius:99px') + '<div class="col" style="flex:1;gap:6px">' + b('144px', '14px') + b('96px', '12px') + '</div></div>'
                  + '<div class="col" style="flex:1;justify-content:flex-end;gap:10px;padding:16px">' + [['in', '176px'], ['in', '240px'], ['out', '208px'], ['in', '144px'], ['out', '256px']].map(function (m) {
                      return '<div class="row" style="gap:8px;justify-content:' + (m[0] === 'out' ? 'flex-end' : 'flex-start') + '">' + (m[0] === 'in' ? b('28px', '28px', 'border-radius:99px') : '') + b(m[1], '36px', 'border-radius:16px;max-width:70%') + '</div>';
                    }).join('') + '</div>'
                  + '<div class="row" style="gap:8px;padding:8px;border-top:1px solid #dde3e9;background:#fff">' + b('44px', '44px', 'border-radius:99px') + b('100%', '44px', 'border-radius:99px;flex:1') + b('44px', '44px', 'border-radius:99px') + '</div></div>'
                : '<div class="show-md" style="align-items:center;justify-content:center;flex-direction:column;gap:12px;background:linear-gradient(180deg,#f6f8fa,#fff 70%)">' + b('64px', '64px', 'border-radius:16px') + b('176px', '20px') + b('256px', '16px') + '</div>')
              + '</div>',
            profile: '<div class="card">' + '<div style="height:88px;background:#dde3e9"></div><div class="col" style="align-items:center;padding:0 20px 20px;gap:10px">' + b('80px', '80px', 'margin-top:-40px;border-radius:99px;box-shadow:0 0 0 4px #fff')
              + b('192px', '28px') + b('256px', '16px') + '<div class="row" style="gap:8px">' + b('112px', '20px', 'border-radius:99px') + b('128px', '20px', 'border-radius:99px') + '</div></div></div>'
              + times(3, b('208px', '24px', 'margin:32px 0 12px') + '<div class="card" style="margin-top:0">' + rows(2).replace('border-top:1px solid rgb(221 227 233 / 0.6)', 'border-top:0') + '</div>'),
            sell: '<div style="max-width:42rem;margin:0 auto">' + title('208px', '100%') + '<div class="card" style="margin-top:20px"><div class="pad">' + b('80px', '24px') + b('100%', '152px', 'margin-top:12px;border-radius:16px') + '</div>'
              + '<div class="pad col" style="gap:16px;border-top:1px solid #dde3e9">' + b('80px', '24px') + field('48px') + field('80px') + field('80px') + field('96px', '112px') + '</div></div></div>',
            auth: '<div class="split-2"><div class="show-lg">' + b('176px', '24px', 'border-radius:99px') + b('100%', '44px', 'margin-top:20px;max-width:32rem') + b('80%', '44px', 'margin-top:12px;max-width:28rem') + b('100%', '296px', 'margin-top:48px;max-width:36rem;border-radius:24px') + '</div>'
              + '<div style="max-width:28rem;width:100%;margin:0 auto;padding-top:36px"><div class="card col" style="gap:18px;padding:44px 20px 20px;border-radius:24px"><div class="col" style="align-items:center">' + b('160px', '28px') + b('224px', '16px') + '</div>'
              + times(path === '/register' ? 5 : 2, field('112px')) + b('100%', '48px', 'border-radius:12px') + b('192px', '16px', 'margin:0 auto') + '</div></div></div>',
            grid: title('224px', '320px') + '<div class="g2-4" style="margin-top:24px">' + times(8, card) + '</div>'
          };

          var page = path === '/' ? (signedIn ? 'home' : 'splash')
            : path === '/home' ? 'home'
            : path.indexOf('/browse') === 0 ? 'browse'
            : path.indexOf('/listings/') === 0 ? 'detail'
            : path.indexOf('/messages') === 0 ? 'messages'
            : path.indexOf('/profile') === 0 ? 'profile'
            : path.indexOf('/sell') === 0 ? 'sell'
            : path === '/login' || path === '/register' ? 'auth'
            : 'grid';
          document.getElementById('boot-main').innerHTML = pages[page];
          document.getElementById('boot-links').innerHTML = times(signedIn ? 3 : 2, b('64px', '14px'));
          if (signedIn) document.getElementById('boot-account').style.width = window.innerWidth >= 640 ? '112px' : '40px';
          var bar = document.getElementById('boot-tabbar'), n = signedIn ? 5 : 3;
          bar.style.gridTemplateColumns = 'repeat(' + n + ', minmax(0, 1fr))';
          bar.innerHTML = times(n, '<div>' + b('24px', '24px', 'border-radius:8px') + b('40px', '10px') + '</div>');
        })();
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
